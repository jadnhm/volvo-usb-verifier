# Volvo XC70 2012 USB Media Pipeline — configuration file
#
# Copy this file to your project root (next to volvo_pipeline.py) and
# uncomment the settings you want to make permanent for your USB drive.
#
# CLI flags always take precedence over values here, so you can still
# override individual settings per run without editing this file.
#
# All boolean options accept: true / false  (case-insensitive)
#

[pipeline]

# --------------------------------------------------------------------------
# Step 0: Junk file cleaner
# --------------------------------------------------------------------------
# Remove .DS_Store, Thumbs.db, __MACOSX/, System Volume Information/, etc.
# apply_clean = false

# --------------------------------------------------------------------------
# Step 0.5: Folder splitter (runs before first verify when enabled)
# --------------------------------------------------------------------------
# Preview folders that exceed the 254-file limit (no files moved)
# run_split = false

# Move files into numbered subfolders to fix the over-limit folders
# apply_split = false

# Maximum audio files per subfolder when splitting (default: 200)
# split_group_size = 200

# --------------------------------------------------------------------------
# Step 2: Path / filename fixer
# --------------------------------------------------------------------------
# Rename files to fix long filenames and invalid characters
# apply_path = false

# --------------------------------------------------------------------------
# Step 4: Lossless converter (FLAC / WAV / AIFF / APE / ALAC → AAC M4A)
#   Requires ffmpeg on PATH unless skip_convert = true
# --------------------------------------------------------------------------
# Skip the converter step entirely (no ffmpeg required)
# skip_convert = false

# Convert lossless files to AAC M4A
# apply_convert = false

# Keep the original lossless file after a successful conversion
# (default: source file is deleted on success)
# keep_originals_convert = false

# Skip files whose expected .m4a output already exists — useful after
# an interrupted conversion job
# resume_convert = false

# --------------------------------------------------------------------------
# Step 6: ID3 tag fixer
# --------------------------------------------------------------------------
# Fix ID3 versions, missing tags, and oversized album art
# apply_id3 = false
